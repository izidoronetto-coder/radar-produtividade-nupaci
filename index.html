  Array.prototype.slice.call(doc.head.children).forEach(function(n){
    if(n.tagName==="TITLE")return;
    if(n.tagName==="SCRIPT"){scripts.push([n,document.head]);return}
    if(n.tagName==="META"&&(n.hasAttribute("charset")||n.getAttribute("name")==="application-name"))return;
    headNodes.push(document.importNode(n,true))});
  /* os estilos do RADAR entram NA FRENTE de qualquer estilo ja existente (ex.: o da extensao): a exportacao de imagem usa o primeiro <style> da pagina */
  var firstHead=document.head.firstChild;headNodes.forEach(function(n){document.head.insertBefore(n,firstHead)});
  Array.prototype.forEach.call(doc.body.attributes,function(a){document.body.setAttribute(a.name,a.value)});
  document.body.removeAttribute("style");
  Array.prototype.slice.call(doc.body.childNodes).forEach(function(n){
    if(n.nodeType===1&&n.tagName==="SCRIPT"){scripts.push([n,document.body]);return}
    document.body.appendChild(document.importNode(n,true))});
  try{window.__RP=null}catch(e){}
  scripts.forEach(function(pair){var s=pair[0],c=document.createElement("script");Array.prototype.forEach.call(s.attributes,function(a){c.setAttribute(a.name,a.value)});c.textContent=s.textContent;pair[1].appendChild(c)})
}
function fail(msg){var e=document.getElementById("rpErr");if(e)e.textContent=msg}
function busy(on){var b=document.getElementById("rpGo");if(b){b.disabled=on;b.textContent=on?"Verificando…":"Entrar"}}
var KEY="radarRp:"+(P?P.s.slice(0,16):"");
function boot(){
  if(!P||!window.crypto||!crypto.subtle||typeof DecompressionStream==="undefined"){fail("Este navegador não é compatível. Use o Chrome ou o Edge atualizados.");return}
  var saved=null;try{saved=sessionStorage.getItem(KEY)}catch(e){}
  if(saved){busy(true);crypto.subtle.importKey("raw",b64d(saved),{name:"AES-GCM"},false,["decrypt"]).then(openWith).then(mount).catch(function(){try{sessionStorage.removeItem(KEY)}catch(e){}busy(false)})}
  document.getElementById("rpForm").addEventListener("submit",function(ev){
    ev.preventDefault();var pw=document.getElementById("rpPw").value;if(!pw){fail("Digite a senha.");return}
    fail("");busy(true);
    derive(pw).then(function(key){return openWith(key).then(function(html){
      if(document.getElementById("rpRm").checked){crypto.subtle.exportKey("raw",key).then(function(raw){try{sessionStorage.setItem(KEY,b64e(new Uint8Array(raw)))}catch(e){}})}
      mount(html)})})
    .catch(function(){busy(false);document.getElementById("rpPw").select();setTimeout(function(){fail("Senha incorreta.")},700)})
  })
}
boot()
